name: Bug report
description: Report a reproducible problem in Trailhead Camp Planner.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Trailhead Camp Planner. Do not include real trip, member, location, or credential data.
  - type: dropdown
    id: mode
    attributes:
      label: App mode
      options:
        - Fictional browser-only demo
        - Connected local Supabase environment
        - Self-hosted environment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result, actual result, and the smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node/Python versions, and relevant local service versions.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed credentials, personal data, private locations, and real trip content from this report.
          required: true
