[tool.poetry]
name = "trailhead-camp-planner-api"
version = "1.0.0"
description = "Optional local API for review-before-write planning suggestions and camping guidance."
authors = ["Trailhead Camp Planner contributors"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = ">=0.135.1,<0.142.0"}
google-genai = ">=1,<3"
openai = ">=2.14,<4.0"
python-dotenv = "^1.2.2"
httpx = "^0.28.1"
supabase = "^2.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
